# Sysbuild configuration file.

# Enable MCUboot by default
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
# No key file here. Pass the active public key at build time:
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"<absolute path to pellet-kN.public.pem>\"
# sysbuild.cmake refuses any key that is not active in firmware/signing_keys.json.
# See docs/firmware-signing-keys.md.

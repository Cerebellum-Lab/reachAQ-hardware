description: |
  Simple collection of GPIOs for simple things

compatible: "ll,generic-gpios"

include: base.yaml

properties:
  input-gpios:
    type: phandle-array
  input-gpio-names:
    type: string-array
  input-gpio-interrupt-enable:
    type: string-array
# Future, if string-array of enumerations are supported
#    enum:
#    - DISABLE
#    - RISING
#    - FALLING
#    - BOTH
    description: Array of interrupt enable states for each input GPIO. Valid values DISABLE, RISING, FALLING, or BOTH
  output-gpios:
    type: phandle-array
  output-gpio-names:
    type: string-array
  output-gpio-interrupt-enable:
    type: string-array
  pulse-enable-gpio-names:
    type: string-array
    description: |
      Names of the pins that may be driven by JERRYCAN_CMD_GPIO_PULSE, the finite
      firmware-timed digital pulse. Omitting the property refuses every pulse, so a
      board has to opt a line in deliberately. Do not list a pin another driver also
      drives: on the pellet board STIM0 and STIM1 are the tone generator's TTL
      confirmations and a pulse there would contend with them.

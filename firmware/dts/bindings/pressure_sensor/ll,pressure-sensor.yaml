description: |
  Pressure Sensor using ADC peripherals

compatible: "ll,pressure-sensor"

include:
  - name: base.yaml

properties:
  io-channels:
    type: phandle-array
    required: true
    description: ADC peripheral instance and channel number
  sample-rate:
    type: int
    required: true
    description: The rate at which the pressure sensor is sampled
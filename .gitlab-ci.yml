stages:
  - check
  - build

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Job that is run on merge requests
check_formatting:
  image: registry.gitlab.leaflabs.com/cuanschutz/autotrainer/code-format
  interruptible: true
  stage: check
  variables:
    ENFORCE_FORMAT_DIR: 'firmware'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - $ENFORCE_FORMAT_DIR/**/*
        - docker/**/*
  script:
    - git fetch
    - git-clang-format -v --commit origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME -q --diff -- $ENFORCE_FORMAT_DIR

.build_firmware_template: &build_firmware_template
  image: registry.gitlab.leaflabs.com/cuanschutz/autotrainer/zephyr-sdk
  stage: build
  tags:
    - linux
  cache:
    key: deps-cache
    paths:
      - deps
  artifacts:
    paths:
      - firmware/${MODULE}_fw.hex
      - firmware/${MODULE}_bootloader.hex
  rules:
    - changes:
        - firmware/**/*
        - docker/**/*
  script:
    - cd firmware
    - west init -l
    - west update
    - cd ${MODULE}
    - west build -p --sysbuild -b ${BOARD}
    - cp build/${MODULE}/zephyr/zephyr.signed.hex ../${MODULE}_fw.hex
    - cp build/mcuboot/zephyr/zephyr.hex ../${MODULE}_bootloader.hex

# Build the firmware for the nucleo_g474re board- will update this once we're developing on real hardware
build_pellet_nucleo_firmware:
  <<: *build_firmware_template
  variables:
    MODULE: pellet_module
    BOARD: nucleo_g474re

build_pellet_firmware:
  <<: *build_firmware_template
  variables:
    MODULE: pellet_module
    BOARD: cerebellumlab_pellet_module

build_magnet_nucleo_firmware:
  <<: *build_firmware_template
  variables:
    MODULE: magnet_module
    BOARD: nucleo_g474re

build_magnet_firmware:
  <<: *build_firmware_template
  variables:
    MODULE: magnet_module
    BOARD: cerebellumlab_magnet_module

# Generate diffs for PCB projects
.generate_hardware_diffs_template: &generate_hardware_diffs_template
  image:
    name: leoheck/kiri:latest
    docker:
      user: root
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - $PROJECT_DIR/**/*
  artifacts:
    paths:
      - $PROJECT_DIR/.kiri
  before_script:
    - export PATH=$PATH:/home/kiri/.local/share/kiri/bin/:/home/kiri/.local/share/kiri/submodules/KiCad-Diff/bin:/home/kiri/bin
    - export TERM=xterm
  script:
    - kiri --no-server -o $(git rev-parse --short $CI_MERGE_REQUEST_DIFF_BASE_SHA) $PROJECT_DIR/$PROJECT_FILE

generate_pellet_diffs:
  <<: *generate_hardware_diffs_template
  variables:
    PROJECT_DIR: hardware/pellet_module
    PROJECT_FILE: pellet.kicad_pro

generate_magnet_diffs:
  <<: *generate_hardware_diffs_template
  variables:
    PROJECT_DIR: hardware/magnet_module
    PROJECT_FILE: magnet.kicad_pro

generate_jetson_diffs:
  <<: *generate_hardware_diffs_template
  variables:
    PROJECT_DIR: hardware/jetson_breakout
    PROJECT_FILE: jetson_breakout.kicad_pro
